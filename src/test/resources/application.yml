spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-client-id
            client-secret: dummy-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email

app:
  jwt:
    issuer: phocamatch
    secret: ahgt+VXC/1ANruwOiL1VLv12C2e5pGQqaDA70qLqB2k=
    access-token-expiration-seconds: 3600
    signup-token-expiration-seconds: 600

  frontend:
    login-success-url: https://swypweb-client.vercel.app/oauth/callback
    login-failure-url: https://swypweb-client.vercel.app/login

cloud:
  aws:
    credentials:
      access-key: dummy-access-key
      secret-key: dummy-secret-key
    region:
      static: ap-northeast-2
    s3:
      bucket: dummy-bucket